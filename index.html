<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0F1B2D"><meta name="robots" content="noindex,nofollow"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style></head><body><title>무한매수 주문장</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* ── 토큰: 색·간격·모서리·글자는 여기서만 정한다 ── */
:root{
  --ground:#EEF1F5; --surface:#FFFFFF; --raised:#F6F8FB; --ink:#0F1B2D; --muted:#5B6B82; --faint:#8D9AAD; --line:#DDE3EB;
  --buy:#D43C2F; --buy-bg:#FCECEA; --sell:#1F5FD1; --sell-bg:#E8F0FD; --warn:#A8500A; --warn-bg:#FFF3DF; --ok:#157F5B; --ok-bg:#E3F4EC;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px;
  --r-card:16px; --r-ctl:12px; --r-chip:8px;
  --t-xs:12px; --t-sm:13.5px; --t-md:15px; --t-lg:17px; --t-xl:21px;
  --sans:'IBM Plex Sans KR',system-ui,-apple-system,'Malgun Gothic',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(15,27,45,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#0A111C; --surface:#131D2C; --raised:#182334; --ink:#E8EDF5; --muted:#9AA8BC; --faint:#6E7D92; --line:#243247;
  --buy:#FF7A6B; --buy-bg:#3A1D1C; --sell:#78A9FF; --sell-bg:#15294A; --warn:#F5B455; --warn-bg:#3A2A10; --ok:#4FD1A1; --ok-bg:#12352A; --shadow:none; } }
:root[data-theme="dark"]{
  --ground:#0A111C; --surface:#131D2C; --raised:#182334; --ink:#E8EDF5; --muted:#9AA8BC; --faint:#6E7D92; --line:#243247;
  --buy:#FF7A6B; --buy-bg:#3A1D1C; --sell:#78A9FF; --sell-bg:#15294A; --warn:#F5B455; --warn-bg:#3A2A10; --ok:#4FD1A1; --ok-bg:#12352A; --shadow:none; }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:var(--t-md);line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--sell);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

.app{max-width:500px;margin:0 auto;padding-inline:var(--s4);padding-block:0 88px}
.view{display:flex;flex-direction:column;gap:var(--s5)}
.col{display:flex;flex-direction:column;gap:var(--s5);min-width:0}

/* 머리 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);padding-block:var(--s3);display:flex;flex-direction:column;gap:var(--s2)}
.row{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);min-width:0}
.brand{display:flex;align-items:baseline;gap:var(--s2);min-width:0}
.brand b{font-size:var(--t-xl);font-weight:700;letter-spacing:-.01em}
.brand span{font-size:var(--t-sm);color:var(--muted);white-space:nowrap}
.pill{font-size:var(--t-xs);font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.pill.rev{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.bar{position:relative;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--ink);border-radius:3px;transition:width .3s}
.bar b{position:absolute;top:0;bottom:0;left:50%;width:2px;background:var(--ground)}
.meta{font-size:var(--t-xs);color:var(--muted);display:flex;align-items:center;gap:var(--s1)}

/* 섹션 머리: 제목 + ⓘ (+ 오른쪽 동작) — 모든 섹션이 같은 모양 */
.sh{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s2);min-height:28px}
.sh h2{margin:0;font-size:var(--t-lg);font-weight:700}
.sh .sp{flex:1}
.i{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--faint);background:none;color:var(--faint);font:600 12px/1 Georgia,serif;font-style:italic;display:inline-grid;place-items:center;padding:0}
.i:hover{border-color:var(--ink);color:var(--ink)}
.ghost{border:0;background:none;color:var(--sell);font-weight:600;font-size:var(--t-sm);padding:var(--s1) var(--s2);border-radius:var(--r-chip)}

/* 카드 — 한 가지 모양만 쓴다 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden}
.card > * + *{border-top:1px solid var(--line)}
.pad{padding:var(--s4)}

.banner{display:flex;gap:var(--s2);align-items:flex-start;background:var(--warn-bg);color:var(--warn);border-radius:var(--r-ctl);padding:var(--s3);font-size:var(--t-sm);font-weight:500}

/* 주문 한 줄 */
.ord{display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);width:100%;background:none;border-inline:0;border-bottom:0;text-align:left}
.ord:first-child{border-top:0}
.ord:active{background:var(--raised)}
.side{font-size:var(--t-xs);font-weight:700;text-align:center;padding:5px 0;border-radius:var(--r-chip)}
.side.buy{background:var(--buy-bg);color:var(--buy)} .side.sell{background:var(--sell-bg);color:var(--sell)}
.what{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
.what b{font-size:var(--t-md);font-weight:600}
.tag{font-size:11px;font-weight:600;padding:2px 6px;border-radius:6px;background:var(--raised);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.tag.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.amt{text-align:right;white-space:nowrap}
.amt b{display:block;font-size:var(--t-xl);font-weight:600;line-height:1.15}
.amt span{font-size:var(--t-xs);color:var(--muted)}
.ladder{padding:var(--s3) var(--s4);display:flex;flex-direction:column;gap:var(--s2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips i{font-style:normal;font-size:var(--t-sm);padding:4px 9px;border-radius:var(--r-chip);background:var(--buy-bg);color:var(--buy)}
.empty{padding:var(--s5) var(--s4);text-align:center;color:var(--muted);font-size:var(--t-sm)}

/* 버튼 — 세 가지뿐: 기본 / 강조 / 위험 */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-ctl);padding:13px var(--s4);font-weight:600;font-size:var(--t-md);width:100%}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.danger{color:var(--buy)}
.btn:active{transform:translateY(1px)}
.btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:var(--s2)}

/* 숫자 칸 */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
.card > .stats{border-top:0}
.stat{background:var(--surface);padding:var(--s3) var(--s4);display:flex;flex-direction:column;gap:2px;min-width:0}
.stat span{font-size:var(--t-xs);color:var(--muted)}
.stat b{font-size:var(--t-lg);font-weight:600;overflow-wrap:anywhere}
.up{color:var(--buy)} .down{color:var(--sell)}

/* 종가 미리보기 */
.sim{display:flex;flex-direction:column;gap:var(--s3);padding:var(--s4)}
.simhead{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s2)}
.simhead b{font-size:var(--t-xl);font-weight:600}
.simhead span{font-size:var(--t-sm);font-weight:600}
input[type=range]{width:100%;accent-color:var(--ink);margin:0;height:28px;padding:0;border:0;background:none}
.scale{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:-6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px var(--s4);font-size:var(--t-sm);margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:600}

/* 기록 */
.day{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:2px var(--s3);padding:var(--s3) var(--s4);width:100%;background:none;border-inline:0;border-bottom:0;text-align:left}
.day:first-child{border-top:0}
.day .d{font-weight:600;font-size:var(--t-sm)}
.day .f{font-size:var(--t-sm);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.day .t{font-size:var(--t-xs);color:var(--muted);text-align:right;white-space:nowrap}
.day .sub{grid-column:2 / 4;font-size:var(--t-xs);color:var(--muted)}
.day .sub.warn{color:var(--warn)}
.chart{padding:var(--s3) var(--s4)}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.chart .c{stroke:var(--ink);stroke-width:1.6;fill:none}
.chart .w{stroke:var(--sell);stroke-width:1.6;fill:none;stroke-dasharray:4 3}
.chart .s{fill:var(--buy)}
.chart .g{stroke:var(--line);stroke-width:1}
.chart .lbl{fill:var(--faint);font:10px var(--mono)}
.chart .cur{stroke:var(--muted);stroke-width:1}
.legend{display:flex;gap:var(--s3);font-size:var(--t-xs);color:var(--muted);flex-wrap:wrap;margin-top:var(--s2)}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid var(--ink);vertical-align:middle;margin-right:4px}
.legend i.w{border-top:2px dashed var(--sell)} .legend i.s{width:6px;height:6px;border:0;border-radius:50%;background:var(--buy)}
.readout{font-size:var(--t-xs);color:var(--ink);min-height:18px;margin-top:var(--s1)}

/* 설정 줄: 이름+ⓘ | 입력칸 — 모든 설정이 같은 모양 */
.field{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,150px);align-items:center;gap:var(--s3);padding:var(--s3) var(--s4)}
.field .nm{display:flex;align-items:center;gap:6px;font-size:var(--t-sm);font-weight:500}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--raised);border:1px solid var(--line);border-radius:var(--r-chip);padding:9px 10px;width:100%;min-width:0}
input.num{font-family:var(--mono);text-align:right}
textarea{font-family:var(--mono);font-size:12px;height:96px;resize:vertical}

/* 탭 */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs div{max-width:500px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabs button{border:0;background:none;padding:10px 0 9px;font-size:var(--t-xs);font-weight:600;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tabs button[aria-selected="true"]{color:var(--ink)}

/* 입력 시트 · 도움말: 같은 틀 */
.sheet-bg{position:fixed;inset:0;z-index:20;background:rgba(8,14,24,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:500px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:var(--s4) var(--s4) calc(var(--s4) + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:var(--s3)}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto;flex:none}
.sheet h3{margin:0;font-size:var(--t-lg);display:flex;align-items:center;gap:var(--s2)}
.sheet h3 .sp{flex:1}
.x{border:0;background:var(--raised);border-radius:50%;width:32px;height:32px;font-size:15px;flex:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
label{display:flex;flex-direction:column;gap:6px;font-size:var(--t-xs);color:var(--muted);font-weight:500;min-width:0}
label .nm{display:flex;align-items:center;gap:6px;min-height:22px}
.group{border:1px solid var(--line);border-radius:var(--r-ctl);padding:var(--s3);display:flex;flex-direction:column;gap:var(--s3)}
.group h4{margin:0;font-size:var(--t-sm)}
.group h4.buy{color:var(--buy)} .group h4.sell{color:var(--sell)}
.status{display:flex;align-items:center;gap:var(--s2);font-size:var(--t-sm);border-radius:var(--r-ctl);padding:10px var(--s3);background:var(--ok-bg);color:var(--ok);font-weight:500;min-height:44px}
.status.warn{background:var(--warn-bg);color:var(--warn)}
.status.info{background:var(--raised);color:var(--ink)}
.status .sp{flex:1}
details summary{font-size:var(--t-sm);color:var(--muted);cursor:pointer;padding:var(--s1) 0}
.help-body{font-size:var(--t-md);line-height:1.65;display:flex;flex-direction:column;gap:var(--s2)}
.help-body p{margin:0}
.help-body dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:var(--s2) var(--s3);font-size:var(--t-sm)}
.help-body dt{font-weight:600} .help-body dd{margin:0;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:999px;font-size:var(--t-sm);font-weight:500;white-space:nowrap;display:flex;gap:var(--s3);align-items:center;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.toast button{border:0;background:none;color:var(--surface);font-weight:700;text-decoration:underline;padding:0}

/* 넓은 화면(메인 화면 3:4·4:3, 커버 화면 가로): 두 칸 */
@media (min-width:600px){
  .app{max-width:1040px;padding-inline:var(--s5)}
  .tabs div{max-width:1040px}
  .view.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:var(--s5);align-items:start}
  .sheet-bg{align-items:center;padding:var(--s4)}
  .sheet{max-width:540px;border-radius:20px;max-height:100%}
  .sheet .grab{display:none}
}
/* 세로가 짧은 가로 화면(커버 화면 16:10 가로) */
@media (orientation:landscape) and (max-height:520px){
  .top{position:static;padding-block:var(--s2)}
  .brand b{font-size:var(--t-lg)}
  .tabs button{padding:6px 0;flex-direction:row;justify-content:center;gap:6px}
  .tabs svg{width:18px;height:18px}
  .app{padding-block:0 52px}
  .view,.col{gap:var(--s4)}
  .amt b{font-size:var(--t-lg)}
  .sheet-bg{padding:var(--s2)}
}
@media (prefers-reduced-motion:no-preference){ .sheet{animation:up .2s ease-out} @keyframes up{from{transform:translateY(20px);opacity:.5}} }
</style>

<div class="app">
  <header class="top" id="top"></header>
  <main id="view"></main>
</div>
<nav class="tabs"><div role="tablist">
  <button role="tab" data-tab="order"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>주문</button>
  <button role="tab" data-tab="log"><svg viewBox="0 0 24 24"><path d="M4 19h16"/><path d="M5 15l4-5 4 3 6-7"/></svg>기록</button>
  <button role="tab" data-tab="set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>설정</button>
</div></nav>
<div id="sheet-root"></div>
<div class="toast" id="toast" hidden></div>

<script>
// 무한매수법 V4.0 계산 엔진 — 엑셀(무한매수법_V4_기록) '기록' 시트의 열 수식을 그대로 옮긴 것.
// 규칙을 바꿀 때는 build.py(엑셀)와 이 파일을 같이 고치고 test_engine.js로 대조한다.
(function (root) {
  const RULES_VERSION = "V4.0 · 2026-09-21";

  // Excel ROUND(0.5는 0에서 먼 쪽) / ROUNDDOWN(x,2) — verify.py의 xround, fl2와 동일
  const xround = (x, n = 2) => { const m = 10 ** n; return Math.sign(x) * Math.floor(Math.abs(x) * m + 0.5 + 1e-9) / m; };
  const fl2 = (x) => Math.floor(x * 100 + 1e-9) / 100;
  const isNum = (v) => typeof v === "number" && isFinite(v);
  const num = (v) => (isNum(v) ? v : 0);

  function derive(cfg) {
    const a = cfg.ticker === "SOXL" ? 20 : 15;
    return { a, b: (2 * a) / cfg.N };
  }

  function initState(cfg) {
    return { O: 0, U: 0, V: 0, W: 0, X: 0, Y: cfg.seed, Z: 0, AA: "일반", AB: "첫매수", AC: null, AD: null,
      AE: cfg.seed / cfg.N, AF: null, AG: null, AH: null, AI: null, AJ: null, AK: null, AL: null, AM: 0, check: "" };
  }

  // rows: [{d, c, bq, bp, sq, sp, ov, cashSet, memo}] → 각 행의 마감 후 상태(엑셀 L~AN열)
  function compute(cfg, rows) {
    const { a, b } = derive(cfg), N = cfg.N;
    const out = []; let p = initState(cfg);
    rows.forEach((r, i) => {
      const bq = num(r.bq), bp = num(r.bp), sq = num(r.sq), sp = num(r.sp);
      const L = isNum(r.c) ? r.c : null;
      const s = { N: p.AA };
      s.O = p.U === 0 && bq > 0 ? p.O + 1 : p.O;
      s.P = bq * bp; s.Q = sq * sp; s.R = xround((s.P + s.Q) * cfg.fee);
      s.U = p.U + bq - sq;
      s.S = sq === 0 ? "" : s.U === 0 ? "전량매도(종료)" : s.N !== "일반" ? "리버스매도" : sp >= num(p.AK) - 0.005 ? "지정가매도" : "쿼터매도";
      s.T = bq === 0 ? "" : s.N !== "일반" ? "쿼터매수" : r.ov ? r.ov : bq > p.AM ? "1회" : "절반";
      s.V = s.U === 0 ? 0 : p.V - sq * p.W + s.P;
      s.W = s.U === 0 ? 0 : s.V / s.U;
      s.X = sq === 0 ? 0 : s.Q - sq * p.W;
      s.Y = isNum(r.cashSet) ? r.cashSet : s.U === 0 && sq > 0 && !cfg.comp ? cfg.seed : p.Y - s.P + s.Q - s.R;
      if (s.U === 0) s.Z = 0;
      else if (s.N === "일반") s.Z = p.Z * (s.S === "지정가매도" ? 0.25 : s.S === "쿼터매도" ? 0.75 : 1) + (s.T === "1회" ? 1 : s.T === "절반" ? 0.5 : 0);
      else { const t1 = p.Z * (sq > 0 ? 1 - 2 / N : 1); s.Z = bq > 0 ? t1 + (N - t1) * 0.25 : t1; }
      // 다음 거래일 모드
      if (s.U === 0) s.AA = "일반";
      else if (s.N === "일반") s.AA = s.Z > N - 1 ? "리버스1" : "일반";
      else if (s.N === "리버스1" && sq === 0) s.AA = "리버스1";
      else if (L !== null && L > s.W * (1 - a / 100)) s.AA = s.Z > N - 1 ? "리버스1" : "일반";
      else s.AA = "리버스";
      s.AC = s.U === 0 || s.AA !== "일반" ? null : (a - b * s.Z) / 100;
      // 별지점
      s.AD = null;
      if (s.U > 0) {
        if (s.AA === "일반") s.AD = xround(s.W * (1 + s.AC));
        else if (s.AA === "리버스" && i >= 4) {
          const last5 = rows.slice(i - 4, i + 1).map((x) => x.c);
          if (last5.every(isNum)) s.AD = xround(last5.reduce((x, y) => x + y, 0) / 5);
        }
      }
      s.AE = s.U === 0 ? s.Y / N : s.AA === "일반" ? s.Y / (N - s.Z) : s.AA === "리버스" ? s.Y / 4 : 0;

      else if (mocDay && bq > 0) s.check = "[!] 매수 주문이 없는 날인데 매수가 입력됨";

  // 마지막 상태 → 다음 거래일 주문표 (엑셀 '주문' 시트)
  function plan(cfg, rows, states) {
    const { a } = derive(cfg);
    const st = states.length ? states[states.length - 1] : initState(cfg);

      if (ph === "전반전") o.buys.push({ label: "매수②", how: "LOC 매수 (평단)", price: st.AH, qty: st.AI, note: "평단 이하로 마감하면 ①과 함께 체결 → 1회" });
      o.sells.push({ label: "매도①", how: "LOC 매도 (쿼터매도)", price: st.AD, qty: st.AJ, note: "보유수량의 1/4" });

      o.sells.push({ label: "매도①", how: "MOC 매도 (무조건)", price: null, qty: st.AJ, note: "보유수량의 1/" + cfg.N / 2 + (ph === "리버스 소진" ? " · 쿼터매수가 불가능해 무조건 매도" : " · 첫날은 매수 없음") });
    } else if (ph === "리버스") {
      if (st.AD === null) o.warn = "리버스 별지점은 최근 5거래일 종가가 모두 있어야 계산됩니다.";
      else {
        o.buys.push({ label: "매수①", how: "LOC 매수 (쿼터매수 · 별지점−0.01)", price: st.AF, qty: st.AG, note: "잔금의 1/4" });
        o.sells.push({ label: "매도①", how: "LOC 매도 (별지점 = 5일 종가 평균)", price: st.AD, qty: st.AJ, note: "보유수량의 1/" + cfg.N / 2 });
      }
    }
    if (o.buys.length && big !== null && ph !== "첫매수" && o.buys[0].price > big) o.buys[0].note += " · 증권사가 거부하면 큰수 " + big.toFixed(2) + "로 대체";
    if (o.buys.length && B > 0) {
      const n = o.buys.reduce((x, y) => x + num(y.qty), 0);
      for (let k = 1; k <= 8; k++) { const pr = fl2(B / (n + k)); if (base === null || pr >= base * (1 - cfg.ladderFloor)) o.ladder.push(pr); }

    return o;
  }

  // 종가(와 선택적으로 장중 고가)로 전날 주문의 예상 체결을 계산 — 입력 도우미. 증권사 체결 내역이 우선한다.
  function predictFills(pl, close, high) {

  }

})(typeof window !== "undefined" ? window : globalThis);

function toast(msg, action){
  const t = $("#toast"); t.innerHTML = '<span>'+esc(msg)+'</span>'+(action?'<button id="toast-act">'+esc(action.label)+'</button>':""); t.hidden = false;
  if (action) $("#toast-act").onclick = () => { t.hidden = true; action.run(); };
  clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, action ? 5000 : 1800);
}
function copyText(t, msg){
  const done = () => toast(msg || "복사했어요");
  const fallback = () => { const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); let ok=false; try { ok = document.execCommand("copy"); } catch(e){} ta.remove(); ok ? done() : toast("복사가 막혀 있어요. 길게 눌러 직접 복사하세요"); };
  navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(t).then(done, fallback) : fallback();
}
async function shareText(t){ if (navigator.share) { try { await navigator.share({ text:t }); return; } catch(e){ if (e && e.name==="AbortError") return; } } copyText(t, "주문을 복사했어요"); }

function kindOf(o, side, ph){
  const type = o.how.startsWith("MOC") ? "MOC" : o.how.startsWith("지정가") ? "지정가" : "LOC";
  if (side==="sell") return type==="MOC" ? ["moc","무조건 매도",type] : type==="지정가" ? ["limit","익절 매도",type] : ph==="리버스" ? ["rsell","리버스 매도",type] : ["quarter","쿼터매도",type];
  if (ph==="첫매수") return ["big","첫 매수",type];
  if (ph==="리버스") return ["qbuy","쿼터매수",type];
  return o.label==="매수②" ? ["avg","평단 매수",type] : ["star","별지점 매수",type];
}
const orderLine = (o, title, type) => title+" "+type+(o.price==null?"":" "+f2(o.price))+" × "+o.qty+"주";

/* ── 미국장 시간 (뉴욕 시간 · 서머타임 자동) ── */
const NY = new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"});
function nyParts(t){ const p = {}; NY.formatToParts(new Date(t)).forEach(x => p[x.type] = x.value); return p; }
function nyOffset(t){ const p = nyParts(t); return Date.UTC(+p.year, p.month-1, +p.day, +p.hour, +p.minute) - Math.floor(t/60000)*60000; }
function nyToUtc(iso, h, m){ const [y,mo,d] = iso.split("-").map(Number), g = Date.UTC(y, mo-1, d, h, m); return g - nyOffset(g - nyOffset(g)); }
function isTradingDay(iso){ const w = new Date(iso+"T00:00:00Z").getUTCDay(); return w>0 && w<6 && !E.holidays(+iso.slice(0,4)).includes(iso); }
function market(){
  const now = Date.now(), p = nyParts(now), today = p.year+"-"+p.month+"-"+p.day;
  const hm = t => { const m = Math.max(0, Math.round((t-now)/60000)); return m>=60 ? Math.floor(m/60)+"시간 "+(m%60)+"분" : m+"분"; };
  const kst = t => new Date(t).toLocaleTimeString("ko-KR",{timeZone:"Asia/Seoul",hour:"numeric",minute:"2-digit"});
  if (isTradingDay(today)) {
    const pre = nyToUtc(today,4,0), open = nyToUtc(today,9,30), close = nyToUtc(today,16,0);
    if (now < pre) return { cls:"", txt:"프리장 "+kst(pre)+" · "+hm(pre)+" 남음" };
    if (now < open) return { cls:"ok", txt:"프리장 중 · 본장 "+kst(open) };
    if (now < close) return { cls:"ok", txt:"본장 중 · 마감까지 "+hm(close) };
  }
  const d = E.nextTradingDay(today), pre = nyToUtc(d,4,0);
  return { cls:"", txt:"다음 프리장 "+(pre-now<864e5?"":dlabel(d)+" ")+kst(pre) };
}

function chart(st){
  const n = S.rows.length; if (n < 2) return '<div class="empty">기록이 이틀 이상 쌓이면 그래프가 나와요</div>';
  const W = 320, H = 150, P = 6, pts = S.rows.map((r,i) => ({ c:r.c, w:st[i].U?st[i].W:null, s:st[i].AD }));
  const vals = pts.flatMap(p => [p.c, p.w, p.s]).filter(v => v!=null), mn = Math.min(...vals), mx = Math.max(...vals), pad = (mx-mn)*.08 || 1;
  const y = v => P + (H-2*P) * (1 - (v-(mn-pad)) / ((mx+pad)-(mn-pad))), x = i => P + (W-2*P) * i/(n-1);
  const path = k => { let d = "", on = false; pts.forEach((p,i) => { if (p[k]==null) { on = false; return; } d += (on?"L":"M")+x(i).toFixed(1)+" "+y(p[k]).toFixed(1); on = true; }); return d; };
  const ticks = [mn, (mn+mx)/2, mx].map(v => '<line class="g" x1="'+P+'" x2="'+(W-P)+'" y1="'+y(v).toFixed(1)+'" y2="'+y(v).toFixed(1)+'"/><text class="lbl" x="'+(W-P)+'" y="'+(y(v)-3).toFixed(1)+'" text-anchor="end">'+f2(v)+'</text>').join("");
  chart.meta = { n, x, pts };
  return '<div class="chart"><svg id="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="마감가와 평단 그래프">'+ticks+
    '<path class="w" d="'+path("w")+'"/><path class="c" d="'+path("c")+'"/>'+pts.map((p,i) => p.s==null?"":'<circle class="s" cx="'+x(i).toFixed(1)+'" cy="'+y(p.s).toFixed(1)+'" r="1.8"/>').join("")+
    '<line class="cur" id="cur" x1="0" x2="0" y1="'+P+'" y2="'+(H-P)+'" visibility="hidden"/></svg>'+
    '<div class="legend"><span><i></i>마감가</span><span><i class="w"></i>평단</span><span><i class="s"></i>별지점</span></div><div class="readout num" id="readout"></div></div>';
}

  const c = S.cfg, opt = (v,cur,l) => '<option value="'+v+'"'+(String(v)===String(cur)?" selected":"")+'>'+(l||v)+'</option>';
  const num = (id, v, ph) => '<input class="num" id="'+id+'" inputmode="decimal" value="'+(v??"")+'"'+(ph?' placeholder="'+ph+'"':'')+'>';
  const tsv = S.rows.map(r => [r.c,r.bq,r.bp,r.sq,r.sp,r.ov,r.cashSet].map(v=>v==null?"":v).join("\t")).join("\n");
  const lastBk = META.lastBackup ? Math.floor((Date.now()-META.lastBackup)/864e5) : null;
  const col = inner => '<div class="card"><div class="pad" style="display:flex;flex-direction:column;gap:var(--s3)">'+inner+'</div></div>';
  const basic = sec("기본", "", "", '<div class="card">'+
    field("ticker","종목",'<select id="s-ticker">'+opt("TQQQ",c.ticker)+opt("SOXL",c.ticker)+'</select>')+
    field("N","분할 수",'<select id="s-N">'+[20,30,40].map(v=>opt(v,c.N)).join("")+'</select>')+
    field("seed","시드 ($)",num("s-seed",c.seed))+
    field("comp","다시 시작",'<select id="s-comp">'+opt("1",c.comp?"1":"0","복리")+opt("0",c.comp?"1":"0","단리")+'</select>')+
    field("start","시작일",'<input type="date" id="s-start" value="'+c.startDate+'">')+'</div>');
  const calcSet = sec("계산", "", "", '<div class="card">'+
    field("fee","수수료율 (%)",num("s-fee",+(c.fee*100).toFixed(4)))+
    field("bigset","큰수 (+%)",num("s-big",+(c.big*100).toFixed(2)))+
    field("rmode","1/4 끝수",'<select id="s-rmode">'+["내림","반올림","올림"].map(v=>opt(v,c.rmode)).join("")+'</select>')+
    field("floor","하락 대비 범위 (−%)",num("s-floor",+(c.ladderFloor*100).toFixed(1)))+
    field("base","기준 종가",num("s-base",c.baseClose,"자동"))+'</div>')+'<button class="btn primary" id="s-save">설정 저장</button>';
  const data = sec("백업 · 복원", "backup", "", col(
    '<div class="status '+(IN_ART?"info":lastBk==null||lastBk>14?"warn":"info")+'"><span>'+(IN_ART?"저장: "+synced:lastBk==null?"아직 백업한 적이 없어요":"마지막 백업 "+(lastBk?lastBk+"일 전":"오늘"))+'</span></div>'+
    '<div class="btns"><button class="btn" id="bk-copy">백업 복사</button>'+(IN_ART?'':'<button class="btn" id="bk-save">'+(navigator.canShare?"백업 파일 보내기":"백업 파일 저장")+'</button>')+'</div>'+
    '<textarea id="bk-in" placeholder="복원할 백업 내용을 붙여 넣으세요"></textarea>'+
    '<div class="btns"><button class="btn" id="bk-pick">파일 고르기</button><button class="btn danger" id="bk-restore">복원</button></div><input type="file" id="bk-file" accept=".json,.txt,application/json,text/plain" hidden>'));
  const excel = sec("엑셀로 옮기기", "excel", "", col('<textarea id="tsv" readonly>'+esc(tsv)+'</textarea><button class="btn" id="tsv-copy">복사</button>'));
  const standalone = matchMedia("(display-mode: standalone)").matches;
  const appCard = sec("앱", "appinfo", "", col(
    '<div class="status info"><span>계산 규칙 '+E.RULES_VERSION+'</span></div>'+
    (IN_ART ? '' : standalone ? '<div class="status"><span>홈 화면 앱으로 실행 중</span></div>' : installEvt ? '<button class="btn primary" id="install">홈 화면에 설치</button>' : '<div class="status info"><span>브라우저 메뉴 ⋮ → 홈 화면에 추가로 설치할 수 있어요</span></div>')+
    (IN_ART || !navigator.storage || !navigator.storage.persist ? '' : '<div class="status '+(persisted?"":"warn")+'"><span>저장 공간 보호 '+(persisted?"켜짐":"꺼짐")+'</span><span class="sp"></span>'+iBtn("persist")+(persisted?'':'<button class="ghost" id="persist">켜기</button>')+'</div>')+
    '<button class="btn danger" id="wipe">기록 전체 삭제</button>'));
  return '<div class="view split"><div class="col">'+basic+calcSet+'</div><div class="col">'+data+excel+appCard+'</div></div>';
}

function render(){
  header();
  $("#view").innerHTML = tab==="order" ? orderView() : tab==="log" ? logView() : setView();
  if (tab==="order") drawSim();
}

/* ── 도움말 팝업 · 입력 시트: 같은 틀 ── */
let formStash = null;   // 입력 시트 위에서 도움말을 열면, 닫을 때 입력하던 내용을 되살린다
function sheet(inner){ $("#sheet-root").innerHTML = '<div class="sheet-bg" id="bg"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>'+inner+'</div></div>'; }
function closeSheet(){ if (formStash) { const v = formStash; formStash = null; openEntry(openEntry.ctx.i, v); } else $("#sheet-root").innerHTML = ""; }
function openHelp(k){
  const h = HELP[k]; if (!h) return;
  if ($("#form")) { formStash = {}; document.querySelectorAll("#form input, #form select").forEach(el => formStash[el.id] = el.value); formStash._open = !!($("#form details") || {}).open; }
  const body = h.slice(1).map(p => typeof p==="string" ? '<p>'+esc(p)+'</p>' : '<dl>'+p.dl.map(([a,b]) => '<dt>'+a+'</dt><dd>'+b+'</dd>').join("")+'</dl>').join("");
  sheet('<h3>'+esc(h[0])+'<span class="sp"></span><button type="button" class="x" data-close aria-label="닫기">✕</button></h3><div class="help-body">'+body+'</div><button type="button" class="btn" data-close>확인</button>');
}

function openEntry(i, restoreVals){
  const edit = i!=null, r = edit ? S.rows[i] : { d:nextDate() }, isLast = edit && i===S.rows.length-1;
  const v = k => r[k]==null ? "" : r[k];
  const inp = (id, k, mode, ph) => '<input class="num" id="'+id+'" inputmode="'+mode+'" value="'+esc(v(k))+'"'+(ph?' placeholder="'+ph+'"':'')+'>';
  sheet('<form id="form" autocomplete="off" style="display:contents">'+
    '<h3>'+dlabel(r.d)+(edit?" 기록 고치기":" 체결 입력")+'<span class="sp"></span><button type="button" class="x" data-close aria-label="닫기">✕</button></h3>'+
    '<div class="two"><label><span class="nm">날짜 (미국)</span><input type="date" id="f-d" value="'+r.d+'" required></label>'+
    '<label><span class="nm">마감가 ($)</span>'+inp("f-c","c","decimal","필수")+'</label></div>'+
    '<div class="status info" id="f-pred"></div>'+
    '<div class="group"><h4 class="buy">매수 체결</h4><div class="two"><label><span class="nm">수량 (주)</span>'+inp("f-bq","bq","numeric")+'</label><label><span class="nm">평균 단가 ($)</span>'+inp("f-bp","bp","decimal")+'</label></div></div>'+
    '<div class="group"><h4 class="sell">매도 체결</h4><div class="two"><label><span class="nm">수량 (주)</span>'+inp("f-sq","sq","numeric")+'</label><label><span class="nm">평균 단가 ($)</span>'+inp("f-sp","sp","decimal")+'</label></div></div>'+
    '<details'+(r.ov||r.cashSet!=null||r.memo?" open":"")+'><summary>더 보기</summary><div style="display:flex;flex-direction:column;gap:var(--s3);padding-top:var(--s2)">'+
      '<div class="two"><label><span class="nm">1회·절반 '+iBtn("judge")+'</span><select id="f-ov"><option value="">자동</option><option'+(r.ov==="1회"?" selected":"")+'>1회</option><option'+(r.ov==="절반"?" selected":"")+'>절반</option></select></label>'+
      '<label><span class="nm">잔금 맞추기 '+iBtn("cashset")+'</span>'+inp("f-cash","cashSet","decimal")+'</label></div>'+
      '<label><span class="nm">메모 '+iBtn("memo")+'</span><input id="f-memo" value="'+esc(v("memo"))+'"></label></div></details>'+
    '<div class="status" id="f-check" hidden></div>'+
    '<button class="btn primary" type="submit">저장</button>'+(isLast?'<button type="button" class="btn danger" id="f-del">이 날 기록 지우기</button>':'')+'</form>');
  if (restoreVals) { Object.entries(restoreVals).forEach(([id,val]) => { const el = document.getElementById(id); if (el) el.value = val; }); const d = $("#form details"); if (d) d.open = restoreVals._open; }
  openEntry.ctx = { edit, i, isLast };
  bindForm();
  if (!restoreVals) setTimeout(() => { const c = $("#f-c"); if (c && !c.value) c.focus(); }, 60);
}
function bindForm(){
  const { edit, i, isLast } = openEntry.ctx, prevRows = S.rows.slice(0, edit?i:S.rows.length), ppl = E.plan(S.cfg, prevRows, E.compute(S.cfg, prevRows));
  const draft = () => ({ d:$("#f-d").value, c:nval("f-c"), bq:nval("f-bq"), bp:nval("f-bp"), sq:nval("f-sq"), sp:nval("f-sp"), ov:$("#f-ov").value||null, cashSet:nval("f-cash"), memo:$("#f-memo").value.trim()||null });
  const refresh = () => {
    const d = draft(), pr = $("#f-pred"), ck = $("#f-check");
    if (d.c!=null && isFinite(d.c) && d.c>0) {
      const p = E.predictFills(ppl, d.c), txt = (p.bq?"매수 "+p.bq+"주":"매수 없음")+" · "+(p.sq?"매도 "+p.sq+"주":"매도 없음");
      pr.innerHTML = '<span>예상 체결 <b>'+txt+'</b></span><span class="sp"></span>'+iBtn("predict")+'<button type="button" class="ghost" id="f-fill">채우기</button>';
      const s = E.compute(S.cfg, [...prevRows, d]).pop(), bad = s.check.startsWith("[!]");
      ck.hidden = false; ck.className = "status"+(bad?" warn":"");
      ck.innerHTML = '<span>'+(bad ? esc(s.check.slice(4)) : "맞아요 · 저장하면 T "+fT(s.Z)+", "+s.AB)+'</span><span class="sp"></span>'+iBtn("check");
    } else { pr.innerHTML = '<span>마감가를 넣으면 예상 체결이 나와요</span><span class="sp"></span>'+iBtn("predict"); ck.hidden = true; }
  };
  $("#form").oninput = refresh; refresh();
  $("#form").onclick = e => { if (e.target.id!=="f-fill") return; const p = E.predictFills(ppl, nval("f-c"));
    $("#f-bq").value = p.bq||""; $("#f-bp").value = p.bq?p.bp:""; $("#f-sq").value = p.sq||""; $("#f-sp").value = p.sq?+p.sp.toFixed(4):""; refresh(); buzz(); };
  $("#form").onsubmit = e => { e.preventDefault(); const d = draft();
    if (d.c==null || !isFinite(d.c) || d.c<=0) return toast("마감가를 넣어 주세요");
    if (!edit && S.rows.length && d.d <= S.rows[S.rows.length-1].d) return toast("마지막 기록보다 뒤 날짜여야 해요");
    const before = S.rows.map(x => ({...x}));
    if (edit) S.rows[i] = d; else S.rows.push(d);
    persist(); formStash = null; $("#sheet-root").innerHTML = ""; tab = edit ? "log" : "order"; simX = null; render(); buzz();
    toast("저장했어요", { label:"되돌리기", run:() => { S.rows = before; persist(); render(); toast("되돌렸어요"); } });
  };
  if (isLast) { let armed = false; $("#f-del").onclick = ev => { if (!armed) { armed = true; ev.target.textContent = "한 번 더 누르면 지워져요"; return; }
    const before = S.rows.map(x => ({...x})); S.rows.pop(); persist(); $("#sheet-root").innerHTML = ""; render(); toast("지웠어요", { label:"되돌리기", run:() => { S.rows = before; persist(); render(); } }); }; }
}

/* ── 백업 ── */
const backupJSON = () => JSON.stringify({ app:"imb", v:1, savedAt:new Date().toISOString(), cfg:S.cfg, rows:S.rows }, null, 1);
const markBackup = () => { META.lastBackup = Date.now(); ls.set(LSM, META); };
async function saveBackupFile(){
  const name = "무한매수_백업_"+new Date().toISOString().slice(0,10)+".json", file = new File([backupJSON()], name, { type:"application/json" });
  if (navigator.canShare && navigator.canShare({ files:[file] })) { try { await navigator.share({ files:[file], title:name }); markBackup(); render(); return; } catch(e){ if (e && e.name==="AbortError") return; } }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove(); markBackup(); render(); toast("백업 파일을 저장했어요");
}
function restore(btn){
  let d; try { d = JSON.parse($("#bk-in").value); } catch(err) { return toast("백업 내용을 읽을 수 없어요. 전체를 그대로 붙여 넣으세요"); }
  const ok = d && typeof d.cfg==="object" && Array.isArray(d.rows) && d.rows.every(r => r && /^\d{4}-\d{2}-\d{2}$/.test(r.d) && typeof r.c==="number");
  if (!ok) return toast("백업 형식이 아니에요");
  if (!btn.dataset.armed) { btn.dataset.armed = "1"; btn.textContent = d.rows.length+"일 기록으로 덮어쓰기"; return; }
  const before = { cfg:{...S.cfg}, rows:S.rows.map(x=>({...x})) };
  S = { cfg:{...DEF, ...d.cfg}, rows:d.rows.map(r=>({...r})) }; persist(); tab = "order"; simX = null; render();
  toast("복원했어요 ("+S.rows.length+"일)", { label:"되돌리기", run:() => { S = before; persist(); render(); } });
}

/* ── 이벤트 ── */
document.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) { if (e.target.id==="bg") closeSheet(); return; }
  if (b.dataset.help) { e.preventDefault(); return openHelp(b.dataset.help); }
  if (b.hasAttribute("data-close")) return closeSheet();
  if (b.dataset.tab) { tab = b.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (b.dataset.copy!=null) { const t = orderView.all[+b.dataset.copy]; buzz(); return copyText(t, t.split(" × ")[0].replace(/ (LOC|지정가|MOC).*/, "")+" 복사했어요"); }
  if (b.classList.contains("day")) return openEntry(+b.dataset.i);
  switch (b.id) {
    case "add": return openEntry(null);
    case "share": { const { pl, last } = calc(); return shareText("["+S.cfg.ticker+"] "+dlabel(nextDate())+" 주문 · "+pl.phase+(pl.phase==="첫매수"?"":" · T="+fT(last.Z))+"\n"+orderView.all.join("\n")+(pl.ladder.length?"\n하락 대비 LOC 1주씩: "+pl.ladder.map(f2).join(", "):"")); }
    case "tsv-copy": return copyText($("#tsv").value);
    case "bk-copy": markBackup(); return copyText(backupJSON(), "백업을 복사했어요");
    case "bk-save": return saveBackupFile();
    case "bk-pick": return $("#bk-file").click();
    case "bk-restore": return restore(b);
    case "install": installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; render(); }); return;
    case "persist": navigator.storage.persist().then(v => { persisted = v; render(); toast(v ? "저장 공간 보호를 켰어요" : "아직 허용되지 않았어요. 홈 화면에 설치하면 허용되는 경우가 많아요"); }); return;
    case "s-save": {
      const seed = nval("s-seed"); if (!(seed>0)) return toast("시드를 확인해 주세요");
      Object.assign(S.cfg, { ticker:$("#s-ticker").value, N:+$("#s-N").value, seed, comp:$("#s-comp").value==="1", startDate:$("#s-start").value||S.cfg.startDate,
        fee:(nval("s-fee")||0)/100, big:(nval("s-big")??12)/100, rmode:$("#s-rmode").value, ladderFloor:(nval("s-floor")??50)/100, baseClose:nval("s-base") });
      persist(); simX = null; render(); return toast("설정을 저장했어요");
    }
    case "wipe": if (b.dataset.armed) { const before = S.rows.map(x=>({...x})); S.rows = []; persist(); render(); toast("기록을 지웠어요", { label:"되돌리기", run:() => { S.rows = before; persist(); render(); } }); }
      else { b.dataset.armed = "1"; b.textContent = "정말 지우려면 한 번 더 누르세요"; } return;
  }
});
document.addEventListener("input", e => { if (e.target.id==="sim-r") { simX = +e.target.value; drawSim(); } });
document.addEventListener("change", e => { if (e.target.id==="bk-file" && e.target.files[0]) e.target.files[0].text().then(t => { $("#bk-in").value = t; toast("파일을 불러왔어요. 복원을 누르세요"); }); });
document.addEventListener("keydown", e => { if (e.key==="Escape" && $("#bg")) closeSheet(); });
function chartPoint(e){
  const svg = $("#chart"), m = chart.meta; if (!svg || !m) return;
  const rc = svg.getBoundingClientRect(), vx = (e.clientX - rc.left) / rc.width * 320;
  let best = 0; for (let k = 1; k < m.n; k++) if (Math.abs(m.x(k)-vx) < Math.abs(m.x(best)-vx)) best = k;
  const p = m.pts[best], cur = $("#cur"); cur.setAttribute("x1", m.x(best)); cur.setAttribute("x2", m.x(best)); cur.setAttribute("visibility", "visible");
  $("#readout").textContent = dlabel(S.rows[best].d)+"  마감 "+f2(p.c)+(p.w!=null?"  평단 "+f2(p.w):"")+(p.s!=null?"  별지점 "+f2(p.s):"");
}
document.addEventListener("pointerdown", e => { if (e.target.closest("#chart")) chartPoint(e); });
document.addEventListener("pointermove", e => { if (e.buttons && e.target.closest("#chart")) chartPoint(e); });
addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; if (tab==="set") render(); });
addEventListener("appinstalled", () => { installEvt = null; toast("홈 화면에 설치했어요"); });
setInterval(() => { const c = $("#clock"); if (c) { const m = market(); c.textContent = m.txt; c.className = "pill "+m.cls; } }, 30000);

render();
if (!IN_ART && navigator.storage && navigator.storage.persisted) navigator.storage.persisted().then(v => { persisted = v; if (tab==="set") render(); }).catch(() => {});
(async () => {
  let db = null; try { db = IN_ART && window.claude.use ? await window.claude.use("db") : null; } catch(e) {}
  if (!db) { synced = "이 기기"; return; }
  docRef = db.doc("imb/main");
  docRef.onSnapshot(snap => {
    if (snap.metadata && snap.metadata.hasPendingWrites) return;
    if (snap.exists) { const d = snap.data(); S = { cfg:{...DEF, ...d.cfg}, rows:(d.rows||[]).map(r=>({...r})) }; ls.set(LS, S); }
    synced = "동기화됨"; if (!$("#bg")) render();
  }, () => { synced = "연결 끊김"; });
})();
})();
</script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js"))</script></body></html>
